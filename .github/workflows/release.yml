name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Olaf.Cli/Olaf.Cli.csproj -c Release -p:PublishRID=${{ matrix.rid }}
      - name: Assert bundle exists
        run: |
          shopt -s nullglob
          files=(src/Olaf.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/Olaf.Cli*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No published apphost found for ${{ matrix.rid }}" >&2
            exit 1
          fi
          ls -la "src/Olaf.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
      - uses: actions/upload-artifact@v4
        with:
          name: olaf-${{ matrix.rid }}
          path: src/Olaf.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/

  smoke-linux:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: olaf-linux-x64
          path: ./artifacts/linux-x64
      - run: chmod +x ./artifacts/linux-x64/Olaf.Cli
      - run: ./artifacts/linux-x64/Olaf.Cli --help
      - run: ./artifacts/linux-x64/Olaf.Cli --version
      - uses: actions/download-artifact@v4
        with:
          name: olaf-osx-arm64
          path: ./artifacts/osx-arm64
      - uses: actions/download-artifact@v4
        with:
          name: olaf-win-x64
          path: ./artifacts/win-x64
      - name: Assert win/osx bundles exist with size
        run: ls -la ./artifacts/osx-arm64 ./artifacts/win-x64 && du -sh ./artifacts/*

  release:
    needs: [publish, smoke-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./bundles
      - name: Rename apphosts to unique release asset names
        run: |
          mv ./bundles/olaf-linux-x64/Olaf.Cli ./bundles/olaf-linux-x64/olaf-linux-x64
          mv ./bundles/olaf-osx-arm64/Olaf.Cli ./bundles/olaf-osx-arm64/olaf-osx-arm64
          mv ./bundles/olaf-win-x64/Olaf.Cli.exe ./bundles/olaf-win-x64/olaf-win-x64.exe
          chmod +x ./bundles/olaf-linux-x64/olaf-linux-x64 ./bundles/olaf-osx-arm64/olaf-osx-arm64
      - name: Assert release asset count and unique names
        run: |
          shopt -s nullglob
          files=(./bundles/olaf-linux-x64/olaf-linux-x64 ./bundles/olaf-osx-arm64/olaf-osx-arm64 ./bundles/olaf-win-x64/olaf-win-x64.exe)
          if [ ${#files[@]} -ne 3 ]; then
            echo "Expected 3 release assets, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "${files[@]##*/}" | sort -u | wc -l)" -ne 3 ]; then
            echo "Release asset basenames are not unique: ${files[*]}" >&2
            exit 1
          fi
          if [ ! -f ./bundles/olaf-win-x64/olaf-win-x64.exe ]; then
            echo "Windows asset olaf-win-x64.exe missing" >&2
            exit 1
          fi
          ls -la ./bundles/olaf-linux-x64/olaf-linux-x64 ./bundles/olaf-osx-arm64/olaf-osx-arm64 ./bundles/olaf-win-x64/olaf-win-x64.exe
      - run: gh release create "${{ github.ref_name }}" --prerelease ./bundles/olaf-linux-x64/olaf-linux-x64 ./bundles/olaf-osx-arm64/olaf-osx-arm64 ./bundles/olaf-win-x64/olaf-win-x64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nuget:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack src/Olaf.Cli -c Release -o ./nupkg
      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
